# Model Router rules (PROMPT.md 9.3). `agent` = Claude Code subagent in agents/claude/ (its model is pinned there). Lowest tier that has passed the task's golden
# tasks; with no benchmark yet, start_tier is a conservative guess.

tiers = ["T0", "T1", "T2", "T3", "T4"]
t1_enabled = false   # qwen2.5:3b passed extraction golden tasks (EVAL-20261018033333) but invents unstated values; on after the T0 grounding check
t1_fallback = "T0 if a script can do it, else T2; private content with no T1 -> BLOCKED"

[escalation]
on = ["schema_validation_failure", "missing_evidence", "reviewer_rejection", "model_quality_test_failure", "retries_exceeded"]
step = 1
de_escalate_requires = "before/after golden-task evidence (PROMPT.md 9.2.5)"

[privacy]
PRIVATE = "T0/T1 only unless an APR-* approval record allows a cloud model"

[[rule]]
task = "deterministic"   # calculations, hashes, dates, state, tests, rule-based dedup
agent = "none"   # T0: a script, no model
risk = "any"
start_tier = "T0"
floor = "T0"

[[rule]]
task = "schema_extraction"
agent = "quick-helper"   # haiku (T2) while T1 is off
risk = "STANDARD"
start_tier = "T1"
floor = "T1"
review = "T0 schema check + 10% T3 sample"

[[rule]]
task = "classification_triage"
agent = "quick-helper"
risk = "LOW"
start_tier = "T1"
floor = "T1"
review = "T0 schema check"

[[rule]]
task = "short_summary"
agent = "quick-helper"
risk = "LOW"
start_tier = "T2"
floor = "T1"

[[rule]]
task = "routine_code_edit"
agent = "builder"
risk = "STANDARD"
start_tier = "T3"
floor = "T2"
review = "Tester A"

[[rule]]
task = "new_code"
agent = "builder"
risk = "STANDARD"
start_tier = "T3"
floor = "T3"
review = "Testers A/B/C"

[[rule]]
task = "research_synthesis"
agent = "researcher"
risk = "STANDARD"
start_tier = "T3"
environment = "CLAUDE_CODE"   # DEC-0002: Claude does research; Muse no longer the primary researcher
floor = "T3"
review = "Tester B (T3); CRITICAL findings go to the gate review below"

[[rule]]
task = "gate_challenger_review"   # independent second opinion at CRITICAL gates only (DEC-0002)
agent = "none"   # Muse, relayed by Ashish
risk = "CRITICAL"
start_tier = "T4"
environment = "DOT_MUSE"
floor = "T4"
review = "Ashish relays the bundle by hand; result returns as a handoff packet"

[[rule]]
task = "architecture_or_security_review"
agent = "security-reviewer"
risk = "CRITICAL"
start_tier = "T4"
floor = "T4"
review = "different model or provider"

[[rule]]
task = "regulatory_quality_matrix"
agent = "critical-analyst"
risk = "CRITICAL"
start_tier = "T4"
floor = "T4"
review = "different provider + human professional"

[[rule]]
task = "financial_model_go_no_go_supplier_shortlist"
agent = "critical-analyst"
risk = "CRITICAL"
start_tier = "T4"
floor = "T4"
review = "different provider + Ashish"
